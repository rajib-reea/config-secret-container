# ============================================================
# dev - shared development environment.
#
# OpenBao is expected to be reachable but a missing document is tolerated,
# so a half-populated dev store does not block deployment.
# ============================================================

spring:
  config:
    import:
      - optional:vault://cmn/config/dev
      - optional:vault://cmn/secret/dev

  cloud:
    vault:
      uri: ${BAO_ADDR:http://openbao:8200}
      token: ${BAO_TOKEN:}
      fail-fast: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,env

logging:
  level:
    com.cmn.service: DEBUG
