# ============================================================
# staging - production-shaped, pre-release.
#
# Secrets are mandatory. The import is NOT optional and fail-fast is on, so
# the service refuses to start rather than silently running on defaults.
# Environment.STAGING.secretsRequired() is true, so the snapshot also reports
# itself unhealthy if nothing came from OpenBao.
# ============================================================

spring:
  config:
    import:
      - vault://cmn/config/staging
      - vault://cmn/secret/staging

  cloud:
    vault:
      uri: ${BAO_ADDR:https://openbao.staging.internal:8200}
      token: ${BAO_TOKEN}
      fail-fast: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.cmn.service: INFO
