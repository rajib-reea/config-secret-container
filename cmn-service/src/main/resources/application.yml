# ============================================================
# Common configuration + Vault wiring.
#
# There are only two files in this directory:
#
#   application.yml         this file - shared settings and how to reach Vault
#   application-local.yml   developer-machine overrides
#
# There is deliberately NO application-dev.yml / -staging.yml / -prod.yml.
# Everything environment-specific lives in the secret store, under:
#
#   cmn/config/<profile>    non-secret configuration
#   cmn/secret/<profile>    secrets
#
# The paths are resolved from the active profile by Spring Cloud Vault itself
# (see spring.cloud.vault.kv below), so adding an environment means writing
# two documents to the store - not adding a file here.
#
#   cd openbao && PROFILE=staging ./env-to-bao.sh
#
# ------------------------------------------------------------
# OpenBao or HashiCorp Vault
# ------------------------------------------------------------
#
# The local stack runs OpenBao, which implements the HashiCorp Vault API.
# Outside local, this service does not care which one it is talking to and is
# configured entirely with standard Vault conventions:
#
#   VAULT_ADDR        VAULT_TOKEN        VAULT_NAMESPACE
#   VAULT_ROLE_ID     VAULT_SECRET_ID
#
# Point VAULT_ADDR at a real Vault cluster and nothing else changes. The
# BAO_* names are accepted as fallbacks so the local scripts in openbao/ keep
# working unchanged.
#
# The one place the two genuinely differ is the health indicator - see
# management.health.vault below.
# ------------------------------------------------------------
#
# An environment profile is mandatory. Environment.fromActiveProfiles refuses
# to resolve unless exactly one of local/dev/staging/prod is active, so an
# instance can never start without knowing which environment it is:
#
#   java -jar cmn-service.jar --spring.profiles.active=dev
#   SPRING_PROFILES_ACTIVE=prod java -jar cmn-service.jar
# ============================================================

spring:
  profiles:
    # The active environment. One of: local, dev, staging, prod.
    #
    # Change it here, or override without touching this file - both of these
    # outrank the value below, because an environment variable and a command
    # line argument both sit above application.yml in Spring's property
    # precedence order:
    #
    #   SPRING_PROFILES_ACTIVE=prod java -jar cmn-service.jar
    #   java -jar cmn-service.jar --spring.profiles.active=staging
    #
    # Exactly one environment profile must end up active. Environment
    # .fromActiveProfiles throws if none or several are, so a typo here fails
    # at startup rather than silently picking a default.
    #
    # The default is deliberately "local", the most tolerant profile: an
    # instance that reaches production without SPRING_PROFILES_ACTIVE being
    # set will report itself as "local" on /api/v1/environment, which is
    # obviously wrong and easy to spot. Defaulting to a real environment
    # would let a misconfigured deployment look correct.
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: cmn-service

  main:
    banner-mode: off

  cloud:
    vault:
      enabled: true

      # Standard Vault variable first, BAO_ADDR as a local fallback.
      # Use https:// for anything that is not a developer machine.
      uri: ${VAULT_ADDR:${BAO_ADDR:http://localhost:8200}}

      # Vault Enterprise / HCP namespaces. Empty for OpenBao, which has no
      # namespace concept, and empty for Vault OSS.
      namespace: ${VAULT_NAMESPACE:}

      # TOKEN for development, APPROLE for anything real.
      #   OpenBao:  cd openbao && ./bao-approle.sh prod
      #   Vault:    vault write auth/approle/role/cmn-service ...
      authentication: ${VAULT_AUTH:${BAO_AUTH:TOKEN}}
      token: ${VAULT_TOKEN:${BAO_TOKEN:}}

      app-role:
        role-id: ${VAULT_ROLE_ID:${BAO_ROLE_ID:}}
        secret-id: ${VAULT_SECRET_ID:${BAO_SECRET_ID:}}

      # An unreachable or sealed store is fatal everywhere except local,
      # which overrides this to false.
      fail-fast: ${VAULT_FAIL_FAST:${BAO_FAIL_FAST:true}}

      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:cmn}

        # These four settings are what make the layout profile-driven.
        # Spring Cloud Vault reads, for each active profile:
        #
        #   cmn/config            default-context, no profile
        #   cmn/config/<profile>  default-context + separator + profile
        #   cmn/secret            application-name, no profile
        #   cmn/secret/<profile>  application-name + separator + profile
        #
        # which is exactly the structure env-to-bao.sh writes.
        #
        # NOTE: a least-privilege policy must grant read on the two
        # profile-less paths as well. With permission they return 404 and are
        # ignored; without it they return 403 and fail-fast turns that into a
        # startup failure. See openbao/bao-approle.sh.
        default-context: config
        application-name: secret
        profile-separator: '/'

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    vault:
      # Off by default because the local stack is OpenBao.
      #
      # Spring Vault's VaultHealthImpl maps "performance_standby" to a
      # primitive boolean. That field is Vault Enterprise-only: OpenBao omits
      # it from /v1/sys/health entirely, and Jackson then fails with
      #
      #   Cannot map `null` into type `boolean`
      #     (through reference chain: VaultHealthImpl["performance_standby"])
      #
      # leaving /actuator/health permanently DOWN on an otherwise healthy
      # service. Only the indicator is affected; reading configuration and
      # secrets works normally.
      #
      # Against HashiCorp Vault Enterprise the field is present and the
      # indicator works, so turn it on there:
      #
      #   VAULT_HEALTH_ENABLED=true
      enabled: ${VAULT_HEALTH_ENABLED:false}

cmn:
  inspection:
    # Values from Vault are always reported. These prefixes additionally
    # surface the service's own settings, so the endpoint is useful even when
    # the store supplied nothing.
    include-prefixes:
      - cmn.
      - spring.application.

  startup:
    # How long the startup guard waits for configuration to resolve.
    guard-timeout: ${CMN_STARTUP_GUARD_TIMEOUT:10s}

logging:
  level:
    root: INFO
    com.cmn.service: INFO

# ============================================================
# Vault import - every profile EXCEPT local
#
# "!local" is a Spring profile expression: this document is activated for
# dev, staging, prod and anything else, but never for local.
#
# This is what makes the split the project asks for:
#
#   local          reads everything from application-local.yml, no Vault
#   dev/staging/   reads everything from Vault
#   prod
#
# "vault://" with no path defers to spring.cloud.vault.kv above, which
# derives cmn/config/<profile> and cmn/secret/<profile> from the active
# profile. Naming explicit paths here would reintroduce the per-environment
# coupling this layout removes.
# ============================================================
---
spring:
  config:
    activate:
      on-profile: "!local"
    import: vault://
