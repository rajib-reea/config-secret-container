# ============================================================
# Common configuration + OpenBao wiring.
#
# There are only two files in this directory:
#
#   application.yml         this file - shared settings and how to reach OpenBao
#   application-local.yml   developer-machine overrides
#
# There is deliberately NO application-dev.yml / -staging.yml / -prod.yml.
# Everything environment-specific lives in OpenBao, under:
#
#   cmn/config/<profile>    non-secret configuration
#   cmn/secret/<profile>    secrets
#
# The paths are resolved from the active profile by Spring Cloud Vault itself
# (see spring.cloud.vault.kv below), so adding an environment means writing
# two documents to OpenBao - not adding a file here.
#
#   cd openbao && PROFILE=staging ./env-to-bao.sh
#
# An environment profile is mandatory. Environment.fromActiveProfiles refuses
# to resolve unless exactly one of local/dev/staging/prod is active, so an
# instance can never start without knowing which environment it is:
#
#   java -jar cmn-service.jar --spring.profiles.active=dev
#   SPRING_PROFILES_ACTIVE=prod java -jar cmn-service.jar
# ============================================================

spring:
  application:
    name: cmn-service

  main:
    banner-mode: off

  config:
    # "vault://" with no path defers to spring.cloud.vault.kv below, which
    # derives the paths from the active profile. Naming explicit paths here
    # would reintroduce the per-environment coupling this layout removes.
    import: vault://

  cloud:
    vault:
      # OpenBao is API-compatible with Vault, so the Vault client talks to it
      # unchanged.
      enabled: true
      uri: ${BAO_ADDR:http://localhost:8200}

      # TOKEN for development, APPROLE for anything real. Switch with
      # BAO_AUTH=APPROLE and supply BAO_ROLE_ID / BAO_SECRET_ID:
      #     cd openbao && ./bao-approle.sh prod
      authentication: ${BAO_AUTH:TOKEN}
      token: ${BAO_TOKEN:}

      app-role:
        role-id: ${BAO_ROLE_ID:}
        secret-id: ${BAO_SECRET_ID:}

      # An unreachable or sealed OpenBao is fatal everywhere except local,
      # which overrides this to false.
      fail-fast: ${BAO_FAIL_FAST:true}

      kv:
        enabled: true
        backend: cmn

        # These four settings are what make the layout profile-driven.
        # Spring Cloud Vault reads, for each active profile:
        #
        #   cmn/config            default-context, no profile
        #   cmn/config/<profile>  default-context + separator + profile
        #   cmn/secret            application-name, no profile
        #   cmn/secret/<profile>  application-name + separator + profile
        #
        # which is exactly the structure env-to-bao.sh writes.
        default-context: config
        application-name: secret
        profile-separator: '/'

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    vault:
      # Disabled deliberately - this is an OpenBao/Vault incompatibility, not a
      # preference.
      #
      # Spring Vault's VaultHealthImpl maps "performance_standby" to a primitive
      # boolean. That field is Vault Enterprise-only and OpenBao omits it from
      # /v1/sys/health entirely, so Jackson fails with:
      #
      #   Cannot map `null` into type `boolean`
      #     (through reference chain: VaultHealthImpl["performance_standby"])
      #
      # The result is a permanently DOWN health endpoint on an otherwise healthy
      # service. Only the health indicator is affected - reading configuration
      # and secrets from OpenBao works normally.
      #
      # OpenBao's own liveness is checked by the container healthcheck in
      # openbao/docker-compose.yaml.
      enabled: false

cmn:
  inspection:
    # Values from OpenBao are always reported. These prefixes additionally
    # surface the service's own settings, so the endpoint is useful even when
    # OpenBao supplied nothing.
    include-prefixes:
      - cmn.
      - spring.application.

  startup:
    # How long the startup guard waits for configuration to resolve.
    guard-timeout: 10s

logging:
  level:
    root: INFO
    com.cmn.service: INFO
