# ============================================================
# local - a developer's machine.
#
# The only environment with a file of its own. Everything here is a
# convenience for local work; dev, staging and prod take their configuration
# from OpenBao and need no file.
#
#   cd openbao && ./bao-up.sh --migrate
#   export BAO_TOKEN="$(cd openbao && ./bao-token.sh)"
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================

spring:
  config:
    # optional: -> a missing, sealed or absent OpenBao is not fatal here, so
    # unrelated work is never blocked by the secret store being down.
    import: optional:vault://

  cloud:
    vault:
      uri: http://localhost:8200
      fail-fast: false

      kv:
        # env-to-bao.sh writes cmn/config/dev by default, so a developer who
        # has not created a local/ pair still gets real values. Spring Cloud
        # Vault reads every active profile, and later entries win.
        profiles: local,dev

management:
  endpoints:
    web:
      exposure:
        # env and configprops are useful locally and are NOT exposed elsewhere.
        include: health,info,env,configprops

logging:
  level:
    com.cmn.service: DEBUG
    org.springframework.vault: DEBUG
