# ============================================================
# local - a developer's machine.
#
# SELF-CONTAINED. This profile reads every value from this file and does not
# talk to Vault at all:
#
#   local                 all values from this file, Vault disabled
#   dev / staging / prod  all values from Vault, nothing from a file
#
# That split is enforced in two places:
#
#   * application.yml imports vault:// only under the profile expression
#     "!local", so the import is never even attempted here.
#   * spring.cloud.vault.enabled is false below, so the auto-configuration
#     does not start a client either.
#
# The practical effect: `mvn spring-boot:run -Dspring-boot.run.profiles=local`
# works on a laptop with no OpenBao running, no token, and no network.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   java -jar target/cmn-service-0.0.1-SNAPSHOT.jar            # local is the default
#
# ------------------------------------------------------------
# These values are LOCAL DEVELOPMENT DEFAULTS.
#
# They mirror the demo values in the repository-root .env, which are
# intentionally fake. Never put a real credential in this file - it is
# committed. Real per-developer overrides belong in an environment variable
# or an untracked application-local-override.yml.
# ------------------------------------------------------------
# ============================================================

spring:
  cloud:
    vault:
      # No Vault on this profile. Nothing to reach, nothing to fail.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # env and configprops are useful locally and are NOT exposed elsewhere.
        include: health,info,env,configprops

logging:
  level:
    com.cmn.service: DEBUG

cmn:
  inspection:
    # On this profile nothing comes from Vault, so the report would otherwise
    # be almost empty. Naming the local property source makes everything this
    # file defines visible on /api/v1/configuration, exactly as Vault values
    # are on the other profiles.
    include-sources:
      - application-local.yml

