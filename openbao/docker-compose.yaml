# Pinned so the Compose project name does not depend on the directory this
# file happens to live in. Without it, moving the file renames the project
# and orphans the previous stack's network.
name: openbao

services:
  openbao:
    image: openbao/openbao:2.6
    container_name: openbao
    restart: unless-stopped

    ports:
      - "8200:8200"

    environment:
      BAO_ADDR: "http://127.0.0.1:8200"
      # The data volume already inherits openbao:openbao ownership and the
      # config mount is read-only, so the entrypoint's chown pass has nothing
      # to do. Skipping it silences harmless "Operation not permitted" /
      # "Read-only file system" warnings on Windows bind mounts.
      SKIP_CHOWN: "true"

    cap_add:
      - IPC_LOCK

    volumes:
      # Mounted at /openbao/file - the path the image declares as a VOLUME.
      # Named volumes initialised from an existing image directory inherit
      # its ownership (openbao:openbao), so no chown step is required.
      - openbao_data:/openbao/file
      - ./config:/openbao/config:ro

    # The image entrypoint already passes -config=/openbao/config, so the
    # directory is loaded automatically. Passing the file again as well is
    # what produced "ignoring duplicate configuration found in directory".
    command:
      - server

    healthcheck:
      # sealedcode/uninitcode keep the container "healthy" while OpenBao is
      # sealed or not yet initialised - both are normal states, not failures.
      # Without them the container reports unhealthy after every restart.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # cmn-service
  #
  # Opt-in, so `docker compose up -d` still starts OpenBao alone:
  #
  #     docker compose --profile app up -d --build
  #
  # BAO_TOKEN must be supplied. The scripts write it to .openbao-keys.json,
  # so the usual invocation is:
  #
  #     BAO_TOKEN="$(./bao-token.sh)" docker compose --profile app up -d --build
  #
  # For an AppRole instead of a token:
  #
  #     ./bao-approle.sh prod
  #     set -a && . ./.openbao-approle-prod.env && set +a
  #     SPRING_PROFILES_ACTIVE=prod BAO_AUTH=APPROLE \
  #       docker compose --profile app up -d --build
  # ----------------------------------------------------------
  cmn-service:
    profiles: ["app"]

    build:
      context: ../cmn-service
      dockerfile: Dockerfile

    image: cmn-service:latest
    container_name: cmn-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # No default profile is baked into the image - the service refuses to
      # start without exactly one of local/dev/staging/prod.
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"

      # Standard HashiCorp Vault variables. OpenBao implements the Vault API,
      # so the service is configured the same way either way - point VAULT_ADDR
      # at a real Vault cluster and nothing else here changes.
      #
      # Container-to-container, so the service name resolves, not localhost.
      VAULT_ADDR: "${VAULT_ADDR:-http://openbao:8200}"
      VAULT_NAMESPACE: "${VAULT_NAMESPACE:-}"

      VAULT_AUTH: "${VAULT_AUTH:-${BAO_AUTH:-TOKEN}}"
      VAULT_TOKEN: "${VAULT_TOKEN:-${BAO_TOKEN:-}}"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-${BAO_ROLE_ID:-}}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID:-${BAO_SECRET_ID:-}}"

      # OpenBao omits the Enterprise-only "performance_standby" field, which
      # breaks Spring Vault's health indicator. Set true against Vault
      # Enterprise.
      VAULT_HEALTH_ENABLED: "${VAULT_HEALTH_ENABLED:-false}"

      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"

    depends_on:
      openbao:
        # OpenBao reports healthy while sealed, so this only guarantees the
        # process is up - not that it can serve secrets. The service's own
        # fail-fast and SecretsAvailabilityGuard handle a sealed store.
        condition: service_healthy

volumes:
  openbao_data:
    name: openbao-data
